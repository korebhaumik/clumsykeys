name: Security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-secrets.mjs --history
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Audit all dependencies
        # picomatch is development-only here. Remove this exception when a fixed release is installed.
        run: pnpm audit --audit-level=high --ignore=GHSA-fc5q-39xc-vjpf
      - run: npm run lint && npm run check:all && npm test
      - run: npm run build && npm run build:server
      - run: node scripts/check-secrets.mjs --artifacts
