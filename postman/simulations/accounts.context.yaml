purpose:
  stands_in_for: Supabase Auth and the application-specific PostgREST RPC/read paths; not the PostgreSQL engine.
  unblocks: Deterministic HTTP and browser account flows, upstream write outages, and retry verification without hosted data.
assumptions:
  - id: category-personal-best-read
    status: supported
    claim: The tested local adapter selects the highest owner-scoped WPM for the requested mode, language, test type and length, independent of history pagination.
    reason: The real SDK exercised JSON-field filtering and WPM ordering against the loopback fixture, and the same adapter separately reached real local PostgREST/PostgreSQL with category and owner isolation assertions.
    verification: On 2026-11-17, 65 unit/HTTP/socket tests passed, including an old matching result followed by 23 newer results in another category, authentication, invalid input and account isolation. Real local SQL tests passed 86 assertions; the Auth/Data API integration separately checked duration and language separation, missing quoteLength as medium, snippet lengths and keyword limits. The complete 226-case browser suite passed, including 14 interaction cases and the exact English 30s, English 60s and English 2k 25-word flow in Chrome/WebKit. Playwright and HTTP tests reused the local fixture directly; the Postman simulation CLI was not run. No hosted category-read verification is claimed.
    source: backend/src/practice-category.contract.ts; backend/src/persistence.ts; tests/unit/persistence.test.ts; tests/integration/local-supabase.ts; tests/e2e/interactive-elements.spec.ts; postman/mocks/supabase/default.cjs
    updated_at: "2026-11-17"
  - id: existing-handle-seed
    status: supported
    claim: The one-time database seed fills existing unclaimed handles while preserving claims and producing valid unique public values.
    reason: Local SQL tests exercise the actual maintenance helper for duplicate names, existing claims, email-safe fallback and reruns. The requested hosted migration applied the missing name/handle schema and seed, then read-only adapter verification confirmed the one existing profile and leaderboard handle with no unassigned profiles.
    verification: On 2026-11-15 all 86 local SQL assertions, 56 unit/transport tests and real local Supabase integration passed. Eight affected browser cases verify hover, direct name/handle editing and default accent colors against the fixture. Hosted changes were limited to the three reviewed migrations; no provider settings or deployed application was changed.
    source: supabase/migrations/20261115000300_seed_existing_handles.sql; supabase/tests/database/seed_handles.test.sql; docs/SECURITY_AUDIT.md; tests/e2e/display-name.spec.ts; tests/e2e/handles.spec.ts
    updated_at: "2026-11-15"
  - id: unique-account-handles
    status: supported
    claim: Verified owners can claim canonical lowercase public handles independently of display names and room aliases; duplicate concurrent claims cannot both succeed.
    reason: The local HTTP fixture models the service-only handle RPC and current handle projection. Real local PostgreSQL enforces the format and unique index; real local Auth/Data API integration races two claims and checks current handles on existing leaderboard results.
    verification: On 2026-11-15 all 56 unit/HTTP/socket tests, 78 SQL assertions, and real local Auth/Data API integration passed. Four new browser flows against the fixture cover duplicate display names, conflicts, invalid input, failed-save retry, reload, leaderboard presentation and independent room aliases. A complete browser run had 151 passes and one fixture-data overlap failure; isolating handle scores to the 120-second board resolved it in a combined 15-case handle/leaderboard rerun. This does not verify hosted migrations.
    source: backend/src/account.http.ts; backend/src/persistence.ts; supabase/migrations/20261115000200_unique_account_handles.sql; tests/e2e/handles.spec.ts; tests/integration/local-supabase.ts; supabase/tests/database/handles.test.sql
    updated_at: "2026-11-15"
  - id: account-display-name-sync
    status: supported
    claim: Auth metadata edits update the public profile used by solo leaderboards, while room aliases remain independent.
    reason: The fixture models PUT /auth/v1/user metadata merging and OAuth full_name/user_name metadata. Separate local PostgreSQL tests exercise the real synchronization trigger and leaderboard projection; real local Auth confirms an SDK update reaches the profile.
    verification: On 2026-11-15 all 68 local SQL assertions and the real local Supabase integration passed. Browser verification uses the fixture, not real GitHub consent. Hosted migration and provider refresh behavior remain unverified.
    source: supabase/migrations/20261115000100_account_display_names.sql; supabase/tests/database/display_names.test.sql; tests/integration/local-supabase.ts; tests/e2e/display-name.spec.ts; postman/mocks/supabase/default.cjs
    updated_at: "2026-11-15"
  - id: github-pkce-caller
    status: supported
    claim: The browser requests GitHub OAuth with an S256 PKCE challenge and restores its session from the modeled Supabase callback.
    reason: Official Supabase GitHub documentation defines the SDK flow. Browser tests exercise the real SDK against the local authorize/token fixture, including cancelled OAuth followed by email sign-in.
    verification: Both sign-in and account-creation entry points reached the account page after a modeled GitHub redirect; callback parameters were removed, and an OAuth cancellation error cleared after successful email sign-in. On 2026-11-13, extended browser checks also passed for keyboard activation, session restoration after reload, sign-out and remaining signed out after another reload. The full browser run passed 59 other cases; both extended GitHub cases passed on rerun after scoping an ambiguous sign-out test selector. This does not verify real GitHub credentials or consent.
    source: src/lib/features/auth/AccountPanel.svelte; src/lib/state/account.store.ts; postman/mocks/supabase/default.cjs; tests/e2e/account-design.spec.ts
    updated_at: "2026-11-13"
  - id: private-account-dashboard
    status: supported
    claim: The dashboard API returns lifetime solo-practice totals, bests per mode and five recent summaries for the verified owner.
    reason: The real adapter reached read_account_dashboard in the local Postman request log; SQL tests separately verified aggregation beyond a history page and service-only execute permissions.
    verification: On 2026-11-13 the simulation returned one saved result after an idempotent retry. Twelve new pgTAP assertions passed on local PostgreSQL; browser checks covered empty/populated dashboards, keyboard table scrolling, both themes, narrow screens and failed refreshes retaining the previous snapshot. The migration was then applied to the configured hosted project; the real Express/Supabase smoke verified totals, bests, recent results, an empty second account and denied browser RPC access. Both disposable users were removed.
    source: tests/simulation/accounts.ts; supabase/tests/database/dashboard.test.sql; tests/e2e/account-dashboard.spec.ts; supabase/migrations/20261113000100_account_dashboard.sql
    updated_at: "2026-11-13"
  - id: dashboard-additional-metrics
    status: supported
    claim: The private dashboard includes all correct, incorrect and extra characters from saved solo tests; the UI derives mean duration from typing seconds and completed tests.
    reason: SQL assertions cover totals beyond one history page and empty accounts; the HTTP adapter and browser use the extended response without changing existing statistics.
    verification: On 2026-11-13 all 46 local SQL assertions passed. The real backend reached read_account_dashboard through the existing Postman simulation and asserted the character total; browser checks verified 180 characters and 13.3 seconds across three saved sessions, plus empty-account display in both themes at mobile and desktop widths. The new migration was applied to the hosted project; a real private API read returned 50 characters for a saved 40-correct/10-incorrect test and zero for a separate account. Disposable users were removed.
    source: supabase/migrations/20261113000200_dashboard_characters.sql; supabase/tests/database/dashboard.test.sql; tests/e2e/account-dashboard.spec.ts; tests/simulation/accounts.ts
    updated_at: "2026-11-13"
  - id: hosted-github-provider
    status: supported
    claim: Real GitHub OAuth is configured and enabled on the hosted project.
    reason: After the user configured the provider, the hosted public Auth settings reported GitHub enabled and its authorization endpoint redirected to GitHub with the expected Supabase callback.
    verification: On 2026-11-13, GET /auth/v1/settings returned 200 with external.github true; a PKCE GET /auth/v1/authorize returned 302 to https://github.com/login/oauth/authorize with the configured project's /auth/v1/callback as redirect_uri. This verifies provider enablement and authorization routing, not consent or the client secret exchange. Earlier checks exercised only modeled redirects; no provider credentials or settings were changed by the agent.
    source: docs/SUPABASE.md; https://supabase.com/docs/guides/auth/social-sign-in/auth-github
    updated_at: "2026-11-13"
  - id: hosted-github-consent
    status: unknown
    claim: GitHub consent and the real provider token exchange complete and restore an app session.
    reason: Public endpoint checks stop at the redirect to GitHub; modeled browser callbacks cannot verify real credentials or consent.
    verification: Complete Continue with GitHub in the configured frontend to verify real consent, provider secret exchange and the frontend redirect allowlist together.
    source: src/lib/features/auth/AccountPanel.svelte; src/lib/state/account.store.ts; tests/e2e/account-design.spec.ts
    updated_at: "2026-11-13"
  - id: sdk-http-shapes
    status: supported
    claim: The actual Supabase JS adapter reaches the modeled Auth and PostgREST endpoints with the expected token and RPC payload shapes.
    reason: Official SDK documentation informed the fixture, and both modeled HTTP and a real local Supabase smoke check exercised the adapter. Owner/workspace mock search was skipped because the CLI was signed out; Orbit returned unrelated management endpoints. This CLI has no status command, so whoami confirmed the signed-out state. No cloud resources were published.
    verification: Local simulation observed Auth user lookups, a failed RPC write (503), two successful retries, and a history read containing exactly one result. The separate local Supabase smoke check verified real JWT validation and the same practice RPC.
    source: backend/src/persistence.ts; tests/simulation/accounts.ts; tests/integration/local-supabase.ts; docs/SUPABASE.md
    updated_at: "2026-11-13"
  - id: database-guarantees
    status: supported
    claim: The versioned SQL enforces owner RLS, atomic parent/detail writes, preference revisions, and idempotent result IDs on the tested local Supabase database.
    reason: A mock cannot establish SQL behavior. Thirty-two pgTAP assertions passed against the real local database.
    verification: supabase test db passed after both migrations; real local Auth/Data API smoke check also passed.
    source: supabase/tests/database/persistence.test.sql; supabase/migrations/; tests/integration/local-supabase.ts
    updated_at: "2026-11-13"
  - id: hosted-auth-delivery
    status: unknown
    claim: The hosted project's email confirmation/recovery delivery and production callback allowlist are configured correctly.
    reason: Local fixture callbacks and local Auth do not establish hosted SMTP delivery or dashboard configuration.
    verification: Browser PKCE confirmation/recovery flows passed against the local fixture. Hosted local callback URLs were applied and checked with email confirmation still enabled. Hosted email delivery remains a deployment check.
    source: tests/e2e/accounts.spec.ts; docs/SUPABASE.md
    updated_at: "2026-11-13"
  - id: hosted-account-persistence
    status: supported
    claim: The configured hosted project accepts the real account and practice persistence paths with owner isolation under the applied schema.
    reason: Both migrations were applied through the user's saved CLI login, and a real hosted smoke check exercised the actual Express adapter and Supabase SDK.
    verification: Verified JWTs, signup profile trigger, preference save, atomic practice write and retry, owner history, cross-account RLS, and denied direct browser writes. Both disposable pre-confirmed users were removed without sending email. A final read verified all six tables have RLS and migration history is up to date.
    source: tests/integration/hosted-supabase.ts; supabase/migrations/; scripts/database.mjs
    updated_at: "2026-11-13"
  - id: public-solo-leaderboards
    status: supported
    claim: Public solo summaries are ranked in PostgreSQL; only a verified backend token can request the caller's personal rank.
    reason: The backend uses a service-only RPC and projects display names and score fields without email, account UUIDs, preferences or keystroke details.
    verification: Local SQL tests cover best-per-player ranking, pagination, rolling time filtering, Dev language separation and service-only grants. The real SDK passed leaderboard reads and an upstream 503 through the Postman simulation. The additive migration was applied to hosted Supabase; the hosted backend smoke verified public reads, own rank and denied browser RPC calls, then removed its temporary users.
    source: backend/src/leaderboard.http.ts; supabase/migrations/20261113000300_solo_leaderboards.sql; supabase/tests/database/leaderboards.test.sql; tests/integration/hosted-supabase.ts
    updated_at: "2026-11-13"
  - id: security-audit-http-boundaries
    status: supported
    claim: The real backend preserves account ownership, retry behavior and public projection while applying the audited HTTP and socket input and abuse boundaries.
    reason: The full server suite used the actual SDK against the existing loopback fixture; the Postman simulation request log independently confirmed the real adapter's Auth and RPC calls. These checks do not establish hosted auth configuration or cheat resistance.
    verification: On 2026-11-13, 34 server tests passed, including write quotas, origin rejection, sanitized errors, impossible-score rejection and timed completion ownership. The local simulation on port 15444 returned 503 for an injected write failure, accepted two retries with one stored result, and returned private dashboard/history plus public rankings. A separate hosted read-only catalog query verified six application tables with owner RLS, restricted RPC grants, locked search paths and no storage buckets. Local pgTAP tests were attempted but unavailable because the local database/Docker daemon was stopped. Plausible fabricated scores remain an open integrity finding.
    source: tests/unit/security.test.ts; tests/unit/persistence.test.ts; tests/simulation/accounts.ts; scripts/security-database.sql; docs/SECURITY_AUDIT.md
    updated_at: "2026-11-13"
  - id: browser-preference-cache
    status: supported
    claim: The browser restores validated owner-scoped settings before practice mounts, revalidates through the account API, and preserves dirty edits using the existing preference revision contract.
    reason: Playwright runs the real browser SDK and Express service against the existing local Supabase fixture; delayed and failed first-party preference responses exercise startup and reconciliation without hosted writes.
    verification: On 2026-11-14, twelve focused cache browser cases passed on the frontend-cache-working-tree fingerprint. Matching refreshes retained passage DOM, uncached startup waited for settings, active tests deferred remote changes, dirty edits survived reloads, newer revisions blocked autosave until explicit reload, owner changes restored guest settings, reconnection retried a failed read, and edits made during a pending read were retained and saved. Guest new-tab and code UI persistence passed in both themes at 320/1440px. Malformed/denied storage fell back to usable practice. The final full browser suite then passed all 137 cases, including a thirteenth cache case confirming an uncached initial-read failure still permits local practice with an explicit sync error. This verifies client behavior against local modeled HTTP, not hosted Auth or database state. The Postman simulation CLI was not run for this pass; Playwright reused its existing fixture directly and injected selected first-party failures/delays.
    source: tests/e2e/preferences-cache.spec.ts; src/lib/features/settings/account-preferences.ts; src/lib/features/settings/preferences-cache.ts; postman/mocks/supabase/default.cjs; playwright.config.ts
    updated_at: "2026-11-14"

